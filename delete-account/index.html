<h1>Delete your TrailSafe account.</h1>
<p>You can delete your account in the TrailSafe app. Deleting your account can’t be undone.</p>
<ol>
<li>Open TrailSafe.</li>
<li>Open the menu (≡), then <b>Your profile</b>.</li>
<li>Tap <b>Delete my account</b>, then confirm.</li>
</ol>
